name: Nyxal Visual Generation Quality

on:
  push:
    branches:
      - main
      - "nixal_capacidade_visual.py"
      - "teste_nixal_capacidade_visual.py"
      - "nyxal_web_api.py"
      - "docs/NYXAL_AGENT_STACK.md"
      - ".github/workflows/visual-generation-quality.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-quality:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile visual module and tests
        run: python3 -m py_compile nixal_capacidade_visual.py teste_nixal_capacidade_visual.py nyxal_web_api.py
      - name: Run deterministic visual quality tests
        run: python3 teste_nixal_capacidade_visual.py
