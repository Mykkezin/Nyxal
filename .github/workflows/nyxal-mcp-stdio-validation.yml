name: Nyxal MCP stdio validation

on:
  pull_request:
    branches: [main]
    paths:
      - "nyxal_mcp_tools.py"
      - "teste_mcp_stdio.py"
      - "nixal_tool_use.py"
      - "nixal_capacidades.py"
      - "nixal_integracao_gmail.py"
      - "nixal_amd_developer_cloud.py"
      - "nixal_nucleo_conversacional.py"
      - "nixal_dialogo_qwen.py"
      - "teste_nyxal_function_calling.py"
      - "teste_nyxal_tool_use.py"
      - "teste_nixal_tool_use.py"
      - "teste_nucleo_contexto_persistente.py"
      - "deploy/agent/requirements-mcp.txt"
      - "docs/NYXAL_FERRAMENTAS.md"
      - ".github/workflows/nyxal-mcp-stdio-validation.yml"
  push:
    branches: [main]
    paths:
      - "nyxal_mcp_tools.py"
      - "teste_mcp_stdio.py"
      - "nixal_tool_use.py"
      - "nixal_capacidades.py"
      - "nixal_integracao_gmail.py"
      - "nixal_amd_developer_cloud.py"
      - "nixal_nucleo_conversacional.py"
      - "nixal_dialogo_qwen.py"
      - "teste_nyxal_function_calling.py"
      - "teste_nyxal_tool_use.py"
      - "teste_nixal_tool_use.py"
      - "teste_nucleo_contexto_persistente.py"
      - "deploy/agent/requirements-mcp.txt"
      - "docs/NYXAL_FERRAMENTAS.md"
      - ".github/workflows/nyxal-mcp-stdio-validation.yml"
  workflow_dispatch:

concurrency:
  group: nyxal-mcp-stdio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-mcp-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/agent/requirements-mcp.txt
      - name: Create isolated optional MCP environment
        run: |
          MCP_VENV="$RUNNER_TEMP/nyxal-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "$MCP_VENV"
          "$MCP_VENV/bin/python" -m pip install --disable-pip-version-check --no-input -r deploy/agent/requirements-mcp.txt
          echo "NYXAL_MCP_TEST_PYTHON=$MCP_VENV/bin/python" >> "$GITHUB_ENV"
      - name: Compile MCP implementation and smoke test
        run: |
          python -m py_compile nyxal_mcp_tools.py teste_mcp_stdio.py nixal_tool_use.py nixal_capacidades.py nixal_integracao_gmail.py nixal_amd_developer_cloud.py
      - name: Exercise stdio protocol and tool registry
        run: |
          "$NYXAL_MCP_TEST_PYTHON" teste_mcp_stdio.py
      - name: Test governed tool policies
        run: |
          "$NYXAL_MCP_TEST_PYTHON" -m unittest -v teste_nixal_tool_use teste_nyxal_function_calling teste_nyxal_tool_use teste_nucleo_contexto_persistente
