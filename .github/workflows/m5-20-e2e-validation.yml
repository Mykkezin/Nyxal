name: M5.20 Validacao E2E

on:
  push:
    branches:
      - main
      - feat/m5-20-validacao-e2e
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "teste_m5_20_validacao_e2e.py"
      - ".github/workflows/m5-20-e2e-validation.yml"
  pull_request:
    branches:
      - main
      - feat/m5-20-validacao-e2e
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "teste_m5_20_validacao_e2e.py"

permissions:
  contents: read

jobs:
  validate-m5-20:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.20
        run: python3 -m py_compile nixal_adaptador_sandbox_fisico.py nixal_auditoria_atuacao.py nixal_gateway_atuacao.py nixal_plano_central_controle.py nixal_ciclo_residente.py teste_m5_20_validacao_e2e.py
      - name: Executar teste M5.20
        run: python3 teste_m5_20_validacao_e2e.py
