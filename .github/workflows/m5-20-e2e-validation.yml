name: M5.20 Validacao E2E

on:
  push:
    branches:
      - feat/m5-20-validacao-e2e
  pull_request:
    branches:
      - main
      - feat/m5-20-validacao-e2e
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "teste_m5_20_validacao_e2e.py"
      - ".github/workflows/m5-20-e2e-validation.yml"

jobs:
  validate-m5-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar M5.20
        run: python -m py_compile nixal_adaptador_sandbox_fisico.py nixal_auditoria_atuacao.py nixal_gateway_atuacao.py nixal_plano_central_controle.py nixal_ciclo_residente.py teste_m5_20_validacao_e2e.py
      - name: Executar teste M5.20
        run: python teste_m5_20_validacao_e2e.py
