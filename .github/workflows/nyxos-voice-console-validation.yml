name: NyxOS Voice Console Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "interface/index.html"
      - "interface/js/nyxal-voice-console.js"
      - "teste_nyxos_voice_console.py"
      - ".github/workflows/nyxos-voice-console-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-voice-console:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout without optional submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify system Node.js 22
        run: node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]!==22) process.exit(1); console.log(process.version)'
      - name: Check voice console JavaScript syntax
        run: node --check interface/js/nyxal-voice-console.js
      - name: Compile regression test
        run: python3 -m py_compile teste_nyxos_voice_console.py
      - name: Run voice console regressions
        run: python3 -m unittest -v teste_nyxos_voice_console
