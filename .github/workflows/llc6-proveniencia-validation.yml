name: Nyxal LLC.6 — proveniencia da evidencia

on:
  push:
    branches:
      - feat/llc-evidence-provenance

permissions:
  contents: read

jobs:
  llc6:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar LLC.4, LLC.5 e LLC.6
        run: |
          python -m py_compile nixal_evidencia_ambiental_llc.py
          python -m py_compile nixal_evidencia_longitudinal_llc.py
          python -m py_compile nixal_proveniencia_evidencia_llc.py
          python -m py_compile teste_llc4_evidencia_ambiental.py
          python -m py_compile teste_llc5_evidencia_longitudinal.py
          python -m py_compile teste_llc6_proveniencia_evidencia.py
      - name: Testar LLC.4
        run: python teste_llc4_evidencia_ambiental.py
      - name: Testar LLC.5
        run: python teste_llc5_evidencia_longitudinal.py
      - name: Testar LLC.6
        run: python teste_llc6_proveniencia_evidencia.py
