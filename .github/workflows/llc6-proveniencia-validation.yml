name: Nyxal LLC.6 — proveniencia da evidencia

on:
  push:
    branches:
      - main
      - feat/llc-evidence-provenance
    paths:
      - "nixal_evidencia_ambiental_llc.py"
      - "nixal_evidencia_longitudinal_llc.py"
      - "nixal_proveniencia_evidencia_llc.py"
      - "teste_llc4_evidencia_ambiental.py"
      - "teste_llc5_evidencia_longitudinal.py"
      - "teste_llc6_proveniencia_evidencia.py"
      - ".github/workflows/llc6-proveniencia-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  llc6:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar LLC.4, LLC.5 e LLC.6
        run: |
          python3 -m py_compile nixal_evidencia_ambiental_llc.py
          python3 -m py_compile nixal_evidencia_longitudinal_llc.py
          python3 -m py_compile nixal_proveniencia_evidencia_llc.py
          python3 -m py_compile teste_llc4_evidencia_ambiental.py
          python3 -m py_compile teste_llc5_evidencia_longitudinal.py
          python3 -m py_compile teste_llc6_proveniencia_evidencia.py
      - name: Testar LLC.4
        run: python3 teste_llc4_evidencia_ambiental.py
      - name: Testar LLC.5
        run: python3 teste_llc5_evidencia_longitudinal.py
      - name: Testar LLC.6
        run: python3 teste_llc6_proveniencia_evidencia.py
