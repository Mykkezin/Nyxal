name: Nyxal Root Test Matrix

# Matriz de validação atualizada em 2026-11-18: a allowlist contém 95 testes.
# Ela não pretende executar todos os scripts do repositório; inclui apenas os
# testes selecionados para execução isolada com o Python do runner e sem escrita
# no checkout operacional nem em estado persistente da instalação ativa.
# Permanecem excluídos testes que gravam em $HOME/Nyxal* ou importam
# nixal_capacidades, quando isso pode tocar o estado operacional compartilhado.
# As entradas em subdiretórios incluem a prosódia de voz e a regressão do cristal;
# todas escrevem apenas em diretórios temporários durante esta matriz.
# A lista de caminhos abaixo é a fonte de verdade; este comentário é descritivo.
# A guarda anti-encolhimento abaixo impede que a matriz fique vazia ou encolha.

on:
  pull_request:
    branches:
      - main
    paths:
      - "teste_*.py"
      - "nixal_*.py"
      - "nyxal_*.py"
      - "interface/js/**/*.js"
      - "testes/**/*.py"
      - "deploy/voice/**/*.py"
      - "gerenciador_cristal.py"
      - "cristalizacao.py"
      - "ciclo_cristalizacao.py"
      - "experiencia_qwen.py"
      - "pipeline_integrado.py"
      - "validar_memoria_cristal_isolado.sh"
      - "docs/ISOLAMENTO_MEMORIA_CRISTAL.md"
      - ".github/matriz-validacao-raiz.txt"
      - ".github/workflows/nyxal-root-test-matrix.yml"
  push:
    branches:
      - main
    paths:
      - "teste_*.py"
      - "nixal_*.py"
      - "nyxal_*.py"
      - "testes/**/*.py"
      - "deploy/voice/**/*.py"
      - "gerenciador_cristal.py"
      - "cristalizacao.py"
      - "ciclo_cristalizacao.py"
      - "experiencia_qwen.py"
      - "pipeline_integrado.py"
      - "validar_memoria_cristal_isolado.sh"
      - "docs/ISOLAMENTO_MEMORIA_CRISTAL.md"
      - ".github/matriz-validacao-raiz.txt"
      - ".github/workflows/nyxal-root-test-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matriz-raiz:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify system Python 3.12
        run: python3 --version

      - name: Check the allowlist is complete and free of duplicates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          linhas = Path(".github/matriz-validacao-raiz.txt").read_text(
              encoding="utf-8"
          ).splitlines()
          nomes = [linha.strip() for linha in linhas if linha.strip()]
          assert nomes, "a matriz de validação está vazia"
          assert len(nomes) == len(set(nomes)), "há testes duplicados na matriz"
          from collections import Counter
          duplicados = [n for n, c in Counter(nomes).items() if c > 1]
          assert not duplicados, f"testes duplicados: {duplicados}"
          ausentes = [n for n in nomes if not Path(n).is_file()]
          assert not ausentes, f"testes listados que não existem: {ausentes}"
          print(f"matriz validada: {len(nomes)} testes")
          PY

      - name: Run every matrix test and report each outcome
        run: |
          # Isolar o estado por job faz o critério "não escreve fora do checkout" valer
          # também para os diários duráveis (~/.local/state), que o runner privado
          # compartilha com a instalação viva. Nenhum dos testes atuais grava neles.
          export XDG_STATE_HOME="${RUNNER_TEMP:?runner_sem_temp}/nyxal-estado"
          mkdir -p "$RUNNER_TEMP/matriz-raiz"
          falhas=0
          execucoes=0
          while IFS= read -r teste; do
            [ -n "$teste" ] || continue
            execucoes=$((execucoes + 1))
            # A matriz aceita entradas em subdiretório; o nome do log não pode
            # carregar barra, senão o redirecionamento falha antes do teste.
            log="$RUNNER_TEMP/matriz-raiz/${teste//\//_}.log"
            if python3 "$teste" >"$log" 2>&1; then
              echo "OK   $teste"
            else
              falhas=$((falhas + 1))
              echo "FALHA $teste"
              tail -n 20 "$log"
            fi
          done < .github/matriz-validacao-raiz.txt
          echo "executados=$execucoes falhas=$falhas"
          if [ "$falhas" -ne 0 ]; then
            exit 1
          fi

      - name: Run isolated memory and crystal regression suite
        run: bash validar_memoria_cristal_isolado.sh

      - name: Refuse to pass on zero executions
        run: |
          total=$(grep -c '[^[:space:]]' .github/matriz-validacao-raiz.txt)
          echo "$total"
          if [ "$total" -lt 75 ]; then
            echo "a matriz encolheu além do esperado; revalide o inventário"
            exit 1
          fi
