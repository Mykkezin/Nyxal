name: Nyxal API Security Baseline

on:
  push:
    branches:
      - main
    paths:
      - "nyxal_web_api.py"
      - "nixal_seguranca_http.py"
      - "teste_seguranca_api.py"
      - "deploy/systemd/nyxal-api.service"
      - "deploy/systemd/nyxos-residente.service"
      - "deploy/systemd/instalar_nyxos_servicos.sh"
      - "teste_m5_9_residencia_linux.py"
      - "docs/SEGURANCA_API_NYXAL.md"
      - "teste_api_security_auth.py"
      - "teste_api_barreira_vps.py"
      - "nixal_decisao_autonoma_ci.py"
      - "nixal_evidencia_ci.py"
      - "teste_decisao_autonoma_ci.py"
      - ".github/workflows/nyxal-nivel9-validation.yml"
      - ".github/workflows/security-baseline.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile API security surface
        id: compile_api
        run: |
          python3 -m py_compile nyxal_web_api.py nixal_seguranca_http.py teste_seguranca_api.py teste_api_security_auth.py teste_api_barreira_vps.py teste_decisao_autonoma_ci.py nixal_decisao_autonoma_ci.py nixal_evidencia_ci.py teste_m5_9_residencia_linux.py
      - name: Run deterministic security policy tests
        id: policy_tests
        run: python3 teste_seguranca_api.py

      - name: Run HTTP API security integration tests
        id: http_security
        run: python3 -m unittest teste_api_security_auth.py -v

      - name: Run irreversible VM action barrier tests
        id: vps_barrier
        run: python3 -m unittest teste_api_barreira_vps.py -v

      - name: Run governed autonomous CI decision tests
        id: decision_policy
        run: python3 teste_decisao_autonoma_ci.py

      - name: Validate shell installer syntax
        id: shell_syntax
        run: bash -n deploy/systemd/instalar_nyxos_servicos.sh

      - name: Run Linux residence structural regression
        id: residence_regression
        run: python3 teste_m5_9_residencia_linux.py

      - name: Evaluate validation evidence with Nyxal decision policy
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
          JOB_OUTCOME: ${{ job.status }}
          COMPILE_OUTCOME: ${{ steps.compile_api.outcome }}
          POLICY_OUTCOME: ${{ steps.policy_tests.outcome }}
          HTTP_OUTCOME: ${{ steps.http_security.outcome }}
          VPS_BARRIER_OUTCOME: ${{ steps.vps_barrier.outcome }}
          DECISION_OUTCOME: ${{ steps.decision_policy.outcome }}
          SHELL_OUTCOME: ${{ steps.shell_syntax.outcome }}
          RESIDENCE_OUTCOME: ${{ steps.residence_regression.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from nixal_evidencia_ci import construir_evidencia_ci

          ordens = ["failure", "cancelled", "skipped", "unknown", "success"]
          camadas_http = [
              os.getenv("HTTP_OUTCOME") or "unknown",
              os.getenv("VPS_BARRIER_OUTCOME") or "unknown",
          ]
          outcomes = {
              "compilacao": os.getenv("COMPILE_OUTCOME", "unknown"),
              "politica_origem": os.getenv("POLICY_OUTCOME", "unknown"),
              "integracao_http": min(camadas_http, key=ordens.index),
              "decisor": os.getenv("DECISION_OUTCOME", "unknown"),
              "shell_syntax": os.getenv("SHELL_OUTCOME", "unknown"),
              "regressoes": os.getenv("RESIDENCE_OUTCOME", "unknown"),
          }
          evidence = construir_evidencia_ci(
              head_sha=os.getenv("HEAD_SHA", ""),
              job_outcome=os.getenv("JOB_OUTCOME", "unknown"),
              step_outcomes=outcomes,
          )
          Path(os.environ["RUNNER_TEMP"], "nyxal-ci-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          python3 nixal_decisao_autonoma_ci.py "$RUNNER_TEMP/nyxal-ci-evidence.json"

      - name: Archive structured CI evidence (manual only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nyxal-ci-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/nyxal-ci-evidence.json
          if-no-files-found: warn
          retention-days: 1
