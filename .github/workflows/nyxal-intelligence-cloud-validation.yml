name: Nyxal Intelligence Cloud Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "nixal_agent_hub.py"
      - "nixal_contexto_historico_relevante.py"
      - "nixal_dialogo_qwen.py"
      - "nixal_intent_router.py"
      - "nixal_responses_api.py"
      - "nixal_nucleo_conversacional.py"
      - "nyxal_web_api.py"
      - "teste_nixal_agent_hub.py"
      - "teste_nixal_dialogo_router.py"
      - "teste_nucleo_contexto_persistente.py"
      - "skills/**"
      - ".github/workflows/nyxal-intelligence-cloud-validation.yml"
  push:
    branches: [main]
    paths:
      - "nixal_agent_hub.py"
      - "nixal_contexto_historico_relevante.py"
      - "nixal_dialogo_qwen.py"
      - "nixal_intent_router.py"
      - "nixal_responses_api.py"
      - "nixal_nucleo_conversacional.py"
      - "nyxal_web_api.py"
      - "teste_nixal_agent_hub.py"
      - "teste_nixal_dialogo_router.py"
      - "teste_nucleo_contexto_persistente.py"
      - "skills/**"
      - ".github/workflows/nyxal-intelligence-cloud-validation.yml"

permissions:
  contents: read

concurrency:
  group: nyxal-intelligence-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-syntax:
    name: Syntax and specialist routing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile intelligence modules
        run: |
          python -m py_compile \
            nixal_agent_hub.py \
            nixal_contexto_historico_relevante.py \
            nixal_dialogo_qwen.py \
            nixal_intent_router.py \
            nixal_responses_api.py \
            nixal_nucleo_conversacional.py \
            nyxal_web_api.py \
            teste_nixal_agent_hub.py \
            teste_nixal_dialogo_router.py \
            teste_nucleo_contexto_persistente.py

      - name: Run focused unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest -v \
            teste_nixal_agent_hub \
            teste_nixal_dialogo_router \
            teste_nucleo_contexto_persistente
