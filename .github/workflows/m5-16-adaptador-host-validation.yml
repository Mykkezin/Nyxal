name: M5.16 Adaptador de Host Controlado

on:
  push:
    branches:
      - main
      - feat/m5-16-adaptador-host-controlado
    paths:
      - "nixal_adaptador_host_controlado.py"
      - "teste_m5_16_adaptador_host_controlado.py"
      - "teste_m5_16_cadeia_gateway_adaptador.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - ".github/workflows/m5-16-adaptador-host-validation.yml"
  pull_request:
    branches:
      - main
      - feat/m5-16-adaptador-host-controlado
    paths:
      - "nixal_adaptador_host_controlado.py"
      - "teste_m5_16_adaptador_host_controlado.py"
      - "teste_m5_16_cadeia_gateway_adaptador.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"

permissions:
  contents: read

jobs:
  validate-m5-16:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.16
        run: python3 -m py_compile nixal_adaptador_host_controlado.py teste_m5_16_adaptador_host_controlado.py teste_m5_16_cadeia_gateway_adaptador.py nixal_gateway_atuacao.py nixal_plano_central_controle.py nixal_ciclo_residente.py executar_nyxos_residente.py
      - name: Executar teste M5.16
        run: python3 teste_m5_16_adaptador_host_controlado.py
      - name: Executar teste da cadeia gateway + adaptador
        run: python3 teste_m5_16_cadeia_gateway_adaptador.py
