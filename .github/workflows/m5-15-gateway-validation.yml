name: NyxOS M5.15 — gateway de atuação

on:
  push:
    branches:
      - feat/m5-15-gateway-atuacao
  pull_request:
    branches:
      - main
      - feat/m5-15-gateway-atuacao

jobs:
  validar-m5-15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar M5.15
        run: python -m py_compile nixal_gateway_atuacao.py nixal_plano_central_controle.py teste_m5_15_gateway_atuacao.py
      - name: Executar teste M5.15
        run: python teste_m5_15_gateway_atuacao.py
