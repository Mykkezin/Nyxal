name: NyxOS M5.15 — gateway de atuação

on:
  push:
    branches:
      - feat/m5-15-gateway-atuacao
    paths:
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - "teste_m5_15_gateway_atuacao.py"
  pull_request:
    branches:
      - main
      - feat/m5-15-gateway-atuacao
    paths:
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - "teste_m5_15_gateway_atuacao.py"

permissions:
  contents: read

jobs:
  validar-m5-15:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.15
        run: python -m py_compile nixal_gateway_atuacao.py nixal_plano_central_controle.py nixal_ciclo_residente.py executar_nyxos_residente.py teste_m5_15_gateway_atuacao.py
      - name: Executar teste M5.15
        run: python teste_m5_15_gateway_atuacao.py
