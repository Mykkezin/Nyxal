name: NyxOS M5 — validação do Habitat

on:
  push:
    branches:
      - feat/m5-habitat-nyxos
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar Habitat M5.1
        run: |
          python -m py_compile nixal_habitat.py nixal_processos_habitat.py nixal_persistencia_operacional.py nixal_delta.py nixal_recursos_habitat.py nixal_ciclo_residente.py nixal_auto_experimento_ae2.py corpo_nixal.py nixal_runtime.py nyxal_web_api.py executar_nyxos_residente.py teste_habitat_m5_1.py teste_processos_habitat_m5_2.py teste_persistencia_operacional_m5_3.py teste_delta_m5_4.py teste_auto_experimento_ae2.py teste_ae2_ciclo_residente.py

      - name: Testar Habitat M5.1
        run: python teste_habitat_m5_1.py

      - name: Testar Processos do Habitat M5.2
        run: python teste_processos_habitat_m5_2.py
      - name: Testar Persistência Operacional M5.3
        run: python teste_persistencia_operacional_m5_3.py
      - name: Testar Delta M5.4
        run: python teste_delta_m5_4.py
      - name: Testar Interface M5.5
        run: python teste_interface_m5_5.py
      - name: Testar Recursos do Habitat M5.6
        run: python teste_recursos_habitat_m5_6.py
      - name: Testar Ciclo Residente M5.7
        run: python teste_ciclo_residente_m5_7.py
      - name: Testar Auto-Evolution AE1
        run: python teste_auto_evolucao_ae1.py

      - name: Testar Auto-Experimento AE2
        run: python teste_auto_experimento_ae2.py
      - name: Testar AE2 no Ciclo Residente
        run: python teste_ae2_ciclo_residente.py
