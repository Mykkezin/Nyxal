name: NyxOS M5 — validação do Habitat

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  habitat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar Habitat M5.1
        run: |
          python -m py_compile nixal_habitat.py nixal_processos_habitat.py corpo_nixal.py nyxal_web_api.py teste_habitat_m5_1.py teste_processos_habitat_m5_2.py

      - name: Testar Habitat M5.1
        run: python teste_habitat_m5_1.py

      - name: Testar Processos do Habitat M5.2
        run: python teste_processos_habitat_m5_2.py
