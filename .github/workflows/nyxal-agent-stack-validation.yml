      - "teste_integracao_memoria_conhecimento_runtime.py"
      - "nixal_dialogo_qwen.py"
      - "teste_nyxal_function_calling.py"
      - "docs/NYXAL_FERRAMENTAS.md"
      - "docs/RECUPERACAO_CONTEXTUAL_MEMORIA.md"
      - "docs/MEMORIA_CONVERSACIONAL_PERSISTENTE.md"
      - "nixal_auto_evolucao.py"
      - "nixal_ciclo_residente.py"
      - "nixal_presenca_maquina.py"
      - "executar_nyxos_residente.py"
      - "teste_nixal_display_routes.py"
      - "teste_nixal_agent_hub.py"
      - "teste_nixal_dialogo_router.py"
      - "teste_api_security_auth.py"
      - "teste_nixal_observabilidade_sistema.py"
      - "teste_nixal_capacidade_visual.py"
      - "teste_nixal_integracao_google.py"
      - "teste_nixal_integracao_gmail.py"
      - "teste_nucleo_contexto_persistente.py"
      - "teste_nucleo_conversacional.py"
      - "teste_transporte_conversacional_56_5_2.py"
      - "teste_integracao_sessao_transporte_56_5_4.py"
      - "teste_contexto_conversacional_56_5_5.py"
      - "teste_contexto_historico_relevante_56_4_21.py"
      - "teste_preparacao_investigacao_56_4_22.py"
      - "teste_memorias_persistencia_segura.py"
      - "teste_auto_evolucao_ae1.py"
      - "teste_m5_15_presenca_maquina.py"
      - "teste_m5_9_residencia_linux.py"
      - "interface/display/**"
      - "interface/index.html"
      - "interface/js/nyxal-voice-console.js"
      - "interface/js/nyxal-api-client.js"
      - "interface/js/nyxal-api-client.test.cjs"
      - "teste_nyxos_voice_console.py"
      - "teste_interface_m5_5.py"
      - ".github/workflows/nyxal-agent-stack-validation.yml"
      - ".github/workflows/visual-generation-quality.yml"
      - ".github/workflows/nyxos-voice-console-validation.yml"
      - ".github/workflows/security-baseline.yml"
      - "scripts/autorizar_gmail_nyxal.py"
      - "scripts/configurar_hermes_whatsapp_policy.py"
      - "scripts/nyxal_letta_memory.py"
      - "deploy/agent/**"
      - "skills/**"
      - "deploy/voice/**"
      - "deploy/ci/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-agent-stack:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout without optional submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Verify system Node.js 22 and npm
        run: node -e 'const v=process.versions.node.split(".").map(Number); if(v[0]!==22) process.exit(1); console.log(process.version)' && npm --version
      - name: Check inline JavaScript in the legacy Nyxal interface
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path("interface/index.html").read_text(encoding="utf-8")
          pattern = re.compile(r"<script\b([^>]*)>(.*?)</script\s*>", re.IGNORECASE | re.DOTALL)
          valid_types = {"", "text/javascript", "application/javascript", "module"}
          checked = 0
          with tempfile.TemporaryDirectory(prefix="nyxal-js-check-") as temp:
              root = Path(temp)
              for index, match in enumerate(pattern.finditer(html), start=1):
                  attrs, body = match.group(1), match.group(2)
                  if re.search(r"\bsrc\s*=", attrs, re.IGNORECASE):
                      continue
                  type_match = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, re.IGNORECASE)
                  script_type = type_match.group(1).casefold() if type_match else ""
                  if script_type not in valid_types or not body.strip():
                      continue
                  script = root / f"inline-{index}.js"
                  script.write_text(body, encoding="utf-8")
                  subprocess.run(["node", "--check", str(script)], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit("Nenhum script JavaScript inline foi verificado.")
          print(f"JavaScript inline validado: {checked} scripts")
          PY
      - name: Build passive Nyxal Display
        working-directory: interface/display
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run lint
          npm run build
      - name: Check voice console JavaScript
        run: node --check interface/js/nyxal-voice-console.js
      - name: Check and test shared Nyxal API client
        run: |
          node --check interface/js/nyxal-api-client.js
          node --check interface/js/nyxal-api-client.test.cjs
          node --test interface/js/nyxal-api-client.test.cjs
      - name: Compile integrations
        run: |
          python3 -m compileall -q \
            nyxal_web_api.py \
            nixal_mcp_runtime.py \
            teste_nyxal_mcp_runtime.py \
            teste_mcp_http.py \
            nixal_display_routes.py \
            nixal_agent_hub.py \
            nixal_intent_router.py \
            nixal_responses_api.py \
            teste_nixal_responses_api.py \
            nixal_observabilidade_sistema.py \
            nixal_integracao_gmail.py \
            nixal_capacidade_visual.py \
            nixal_seguranca_http.py \
            deploy/voice/nyxal_pipecat_agent.py \
            deploy/voice/verificar_api_nyxal.py \
            deploy/voice/verificar_contrato_pipecat.py \
            nixal_nucleo_conversacional.py \
            nixal_agente_qwen.py \
            nixal_capacidades.py \
            nixal_vps.py \
            nixal_tool_use.py \
            teste_nixal_tool_use.py \
            teste_nixal_workspace_edits.py \
            teste_nyxal_tool_use.py \
            nixal_transporte_conversacional.py \
            nixal_integracao_sessao_transporte.py \
            nixal_contexto_historico_relevante.py \
            nixal_memoria_investigacao.py \
            nixal_memoria_conhecimento.py \
            nixal_runtime.py \
            teste_limites_armazenamento.py \
            nixal_aprendizado_persistente.py \
            teste_integracao_memoria_conhecimento_runtime.py \
            nixal_auto_evolucao.py \
            nixal_ciclo_residente.py \
            nixal_presenca_maquina.py \
            executar_nyxos_residente.py \
            teste_auto_evolucao_ae1.py \
            teste_m5_15_presenca_maquina.py \
            nixal_dialogo_qwen.py \
            teste_nyxal_function_calling.py \
            teste_nixal_dialogo_router.py \
            teste_nyxos_voice_console.py \
            teste_api_security_auth.py \
            teste_nucleo_contexto_persistente.py \
            teste_nucleo_conversacional.py \
            teste_transporte_conversacional_56_5_2.py \
            teste_integracao_sessao_transporte_56_5_4.py \
            teste_contexto_conversacional_56_5_5.py \
            teste_contexto_historico_relevante_56_4_21.py \
            teste_preparacao_investigacao_56_4_22.py \
            teste_memorias_persistencia_segura.py \
            scripts/autorizar_gmail_nyxal.py \
            scripts/configurar_hermes_whatsapp_policy.py \
            scripts/nyxal_letta_memory.py
      - name: Smoke test optional MCP stdio server (isolated environment)
        shell: bash
        run: |
          if [[ ! -f nyxal_mcp_tools.py || ! -f deploy/agent/requirements-mcp.txt ]]; then
            echo "Optional MCP server/dependencies are absent in this revision; skipping."
          else
            MCP_VENV="$RUNNER_TEMP/nyxal-mcp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap 'rm -rf "$MCP_VENV"' EXIT
            python3 -m venv "$MCP_VENV"
            "$MCP_VENV/bin/python" -m pip install --disable-pip-version-check --no-input -r deploy/agent/requirements-mcp.txt
            "$MCP_VENV/bin/python" -m py_compile nyxal_mcp_tools.py teste_mcp_stdio.py nixal_tool_use.py nixal_capacidades.py
            "$MCP_VENV/bin/python" teste_mcp_stdio.py
            "$MCP_VENV/bin/python" teste_mcp_http.py
          fi
      - name: Validate local setup scripts
        run: |
          bash -n deploy/agent/configurar_nyxal_agent.sh
          bash -n deploy/agent/instalar_nyxal_agent.sh
      - name: Validate local configuration scripts
        run: |
          bash -n deploy/agent/configurar_nyxal_agent.sh
          bash -n deploy/agent/instalar_nyxal_agent.sh
          bash -n deploy/agent/verificar_nyxal_agent.sh
          bash -n deploy/voice/instalar_pipecat_experimental.sh
          bash -n deploy/voice/diagnosticar_runtime_local.sh
          bash -n deploy/ci/diagnosticar_runner_nyxal.sh
      - name: Run focused unit tests
        env:
          NYXAL_DEFENSE_AUDIT_PATH: ${{ runner.temp }}/nyxal-defense-audit-${{ github.run_id }}.jsonl
        run: |
          python3 -m unittest -v \
            teste_nixal_display_routes \
            teste_nixal_agent_hub \
            teste_nixal_tool_use \
            teste_nixal_workspace_edits \
            teste_nyxal_tool_use \
            teste_nyxal_function_calling \
            teste_nyxal_mcp_runtime \
            teste_nyxos_voice_console \
            teste_nixal_responses_api \
            teste_nixal_dialogo_router \
            teste_nixal_observabilidade_sistema \
            teste_nixal_capacidade_visual \
            teste_nixal_integracao_google \
            teste_nixal_integracao_gmail \
            teste_nixal_vps \
            teste_limites_armazenamento \
            teste_nucleo_contexto_persistente \
            teste_nixal_recuperador_contexto \
            teste_nixal_memoria_conversacional \
            teste_memorias_persistencia_segura \
            teste_nixal_trilha_defesa \
            teste_executor_defesa_governada
          python3 -m py_compile nixal_trilha_defesa.py teste_nixal_trilha_defesa.py nixal_executor_defesa_governada.py teste_executor_defesa_governada.py
          python3 teste_nucleo_conversacional.py
          python3 teste_transporte_conversacional_56_5_2.py
          python3 teste_integracao_sessao_transporte_56_5_4.py
          python3 -m unittest -v teste_api_security_auth.py
          python3 teste_contexto_conversacional_56_5_5.py
          python3 teste_contexto_historico_relevante_56_4_21.py
          python3 teste_preparacao_investigacao_56_4_22.py
          python3 teste_auto_evolucao_ae1.py
          python3 teste_m5_15_presenca_maquina.py
          python3 teste_m5_9_residencia_linux.py
          python3 teste_interface_m5_5.py
      - name: Verify knowledge-memory persistence through runtime
        run: python3 teste_integracao_memoria_conhecimento_runtime.py

  validate-vps-public-key:
    # O runner é compartilhado: não lance este job junto com a suíte Agent Stack.
    needs: validate-agent-stack
    if: always() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin'))
    # O runner hospedado não está alocando jobs (runner_id=0); usar o Python 3.12
    # já instalado no runner privado para que este gate curto seja executável.
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout without optional submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile VPS SSH key validation
        run: python3 -m py_compile nixal_vps.py teste_nixal_vps.py
      - name: Run VPS SSH key validation regressions
        run: python3 -m unittest -v teste_nixal_vps.py
