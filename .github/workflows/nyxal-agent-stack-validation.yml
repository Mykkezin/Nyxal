name: Nyxal Agent Stack Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/nyxal-agent-stack-current-main-20261009
      - fix/display-root-route-20261009
      - feat/voz-tempo-real-pipecat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without optional submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrations
        run: |
          python -m compileall -q \
            nyxal_web_api.py \
            nixal_display_routes.py \
            nixal_agent_hub.py \
            nixal_observabilidade_sistema.py \
            nixal_integracao_gmail.py \
            nixal_capacidade_visual.py \
            nixal_seguranca_http.py \
            deploy/voice/nyxal_pipecat_agent.py \
            deploy/voice/verificar_api_nyxal.py \
            deploy/voice/verificar_contrato_pipecat.py \
            scripts/autorizar_gmail_nyxal.py \
            scripts/configurar_hermes_whatsapp_policy.py \
            scripts/nyxal_letta_memory.py
      - name: Validate local setup scripts
        run: |
          bash -n deploy/agent/configurar_nyxal_agent.sh
          bash -n deploy/agent/instalar_nyxal_agent.sh
      - name: Validate local configuration scripts
        run: |
          bash -n deploy/agent/configurar_nyxal_agent.sh
          bash -n deploy/agent/instalar_nyxal_agent.sh
          bash -n deploy/agent/verificar_nyxal_agent.sh
          bash -n deploy/voice/instalar_pipecat_experimental.sh
          bash -n deploy/voice/diagnosticar_runtime_local.sh
      - name: Run focused unit tests
        run: |
          python -m unittest -v \
            teste_nixal_display_routes \
            teste_nixal_agent_hub \
            teste_nixal_observabilidade_sistema \
            teste_nixal_capacidade_visual \
            teste_nixal_integracao_google \
            teste_nixal_integracao_gmail \
            teste_nixal_vps
