name: Nyxal LLC — validação completa

on:
  push:
    branches:
      - main
      - feat/llc-complete-validation
    paths:
      - "nixal_learning_loop_causal.py"
      - "nixal_evidencia_ambiental_llc.py"
      - "nixal_evidencia_longitudinal_llc.py"
      - "nixal_proveniencia_evidencia_llc.py"
      - "nixal_replicacao_llc.py"
      - "nixal_escopo_llc.py"
      - "nixal_aprendizado_llc.py"
      - "nixal_fechamento_llc.py"
      - "nixal_aprendizado_persistente.py"
      - "nixal_runtime.py"
      - "teste_llc*.py"
      - ".github/workflows/llc-completa-validation.yml"
  pull_request:
    branches:
      - main
      - feat/llc-learning-loop
    paths:
      - "nixal_learning_loop_causal.py"
      - "nixal_evidencia_ambiental_llc.py"
      - "nixal_evidencia_longitudinal_llc.py"
      - "nixal_proveniencia_evidencia_llc.py"
      - "nixal_replicacao_llc.py"
      - "nixal_escopo_llc.py"
      - "nixal_aprendizado_llc.py"
      - "nixal_fechamento_llc.py"
      - "nixal_aprendizado_persistente.py"
      - "nixal_runtime.py"
      - "teste_llc*.py"

permissions:
  contents: read

jobs:
  llc-completo:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar cadeia LLC
        run: |
          python3 -m py_compile nixal_learning_loop_causal.py
          python3 -m py_compile nixal_evidencia_ambiental_llc.py
          python3 -m py_compile nixal_evidencia_longitudinal_llc.py
          python3 -m py_compile nixal_proveniencia_evidencia_llc.py
          python3 -m py_compile nixal_replicacao_llc.py
          python3 -m py_compile nixal_escopo_llc.py
          python3 -m py_compile nixal_aprendizado_llc.py
          python3 -m py_compile nixal_fechamento_llc.py
          python3 -m py_compile teste_llc_learning_loop.py
          python3 -m py_compile teste_llc4_evidencia_ambiental.py
          python3 -m py_compile teste_llc5_evidencia_longitudinal.py
          python3 -m py_compile teste_llc6_proveniencia_evidencia.py
          python3 -m py_compile teste_llc_completo.py
      - name: Testar LLC.1–LLC.3
        run: python3 teste_llc_learning_loop.py
      - name: Testar LLC.4
        run: python3 teste_llc4_evidencia_ambiental.py
      - name: Testar LLC.5
        run: python3 teste_llc5_evidencia_longitudinal.py
      - name: Testar LLC.6
        run: python3 teste_llc6_proveniencia_evidencia.py
      - name: Testar LLC.7–LLC.10
        run: python3 teste_llc_completo.py
