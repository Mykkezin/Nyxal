name: M5.21 Audio NyxOS

on:
  push:
    branches:
      - feat/m5-21-audio-nyxos
    paths:
      - "nixal_audio_nyxos.py"
      - "teste_m5_21_audio_nyxos.py"
  pull_request:
    branches:
      - main
      - feat/m5-21-audio-nyxos
    paths:
      - "nixal_audio_nyxos.py"
      - "teste_m5_21_audio_nyxos.py"

permissions:
  contents: read

jobs:
  validate-m5-21:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.21
        run: python -m py_compile nixal_audio_nyxos.py teste_m5_21_audio_nyxos.py
      - name: Executar teste M5.21
        run: python teste_m5_21_audio_nyxos.py
