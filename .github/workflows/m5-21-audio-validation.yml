name: M5.21 Audio NyxOS

on:
  push:
    branches:
      - feat/m5-21-audio-nyxos
  pull_request:
    branches:
      - main
      - feat/m5-21-audio-nyxos
    paths:
      - "nixal_audio_nyxos.py"
      - "teste_m5_21_audio_nyxos.py"
      - ".github/workflows/m5-21-audio-validation.yml"

jobs:
  validate-m5-21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar M5.21
        run: python -m py_compile nixal_audio_nyxos.py teste_m5_21_audio_nyxos.py
      - name: Executar teste M5.21
        run: python teste_m5_21_audio_nyxos.py
