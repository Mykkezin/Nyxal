name: Actions Runner Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-runner-smoke.yml"
permissions:
  contents: read

concurrency:
  group: actions-runner-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Este job é propositalmente mínimo. Não executar scripts do projeto aqui.
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Provar que o executor iniciou
        shell: bash
        run: |
          set -eu
          echo "RUNNER_SMOKE_STARTED"
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'sha=%s\n' "${GITHUB_SHA:-unknown}"
          python3 --version
          git --version
          if command -v node >/dev/null 2>&1; then node --version; else echo "NODE_UNAVAILABLE"; fi
          if command -v npm >/dev/null 2>&1; then npm --version; else echo "NPM_UNAVAILABLE"; fi
          if command -v gh >/dev/null 2>&1; then gh --version | head -n 1; else echo "GH_CLI_UNAVAILABLE"; fi
          if command -v docker >/dev/null 2>&1; then docker --version; else echo "DOCKER_UNAVAILABLE"; fi
          echo "RUNNER_SMOKE_OK"
