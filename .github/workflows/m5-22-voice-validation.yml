name: M5.22 Voice Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "nixal_audio_nyxos.py"
      - "nixal_voz_nyxos.py"
      - "teste_m5_22_voz_nyxos.py"
      - "deploy/voice/**"
  push:
    branches:
      - feat/m5-22-voz-nyxos
      - feat/voz-tempo-real-pipecat
    paths:
      - "nixal_audio_nyxos.py"
      - "nixal_voz_nyxos.py"
      - "teste_m5_22_voz_nyxos.py"
      - "deploy/voice/**"

jobs:
  validate-m5-22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar M5.22
        run: python -m py_compile nixal_audio_nyxos.py nixal_voz_nyxos.py teste_m5_22_voz_nyxos.py
      - name: Compilar adaptador experimental de voz
        run: python -m py_compile deploy/voice/nyxal_pipecat_agent.py deploy/voice/verificar_api_nyxal.py deploy/voice/verificar_contrato_pipecat.py
      - name: Validar scripts de instalação e diagnóstico
        run: bash -n deploy/voice/instalar_pipecat_experimental.sh deploy/voice/diagnosticar_runtime_local.sh
      - name: Executar teste M5.22
        run: python teste_m5_22_voz_nyxos.py
