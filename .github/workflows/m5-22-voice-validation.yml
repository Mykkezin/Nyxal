name: M5.22 Voice Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "nixal_audio_nyxos.py"
      - "nixal_voz_nyxos.py"
      - "teste_m5_22_voz_nyxos.py"
      - "deploy/voice/**"
  push:
    branches:
      - main
      - feat/m5-22-voz-nyxos
      - feat/voz-tempo-real-pipecat
    paths:
      - "nixal_audio_nyxos.py"
      - "nixal_voz_nyxos.py"
      - "teste_m5_22_voz_nyxos.py"
      - "deploy/voice/**"
      - ".github/workflows/m5-22-voice-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m5-22:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.22
        run: python3 -m py_compile nixal_audio_nyxos.py nixal_voz_nyxos.py teste_m5_22_voz_nyxos.py
      - name: Compilar adaptador experimental de voz
        run: python3 -m py_compile deploy/voice/nyxal_pipecat_agent.py deploy/voice/verificar_api_nyxal.py deploy/voice/verificar_contrato_pipecat.py
      - name: Validar scripts de instalação e diagnóstico
        run: bash -n deploy/voice/instalar_pipecat_experimental.sh deploy/voice/diagnosticar_runtime_local.sh
      - name: Executar teste M5.22
        run: python3 teste_m5_22_voz_nyxos.py
