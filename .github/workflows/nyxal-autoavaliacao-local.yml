name: Nyxal Local Self-Assessment Client

on:
  push:
    branches:
      - main
    paths:
      - "falar_com_nyxal_autoavaliacao.py"
      - "teste_falar_com_nyxal_autoavaliacao.py"
      - "docs/NYXAL_AUTOAVALIACAO_LOCAL.md"
      - ".github/workflows/nyxal-autoavaliacao-local.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline-client-tests:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile local client and tests
        run: python3 -m py_compile falar_com_nyxal_autoavaliacao.py teste_falar_com_nyxal_autoavaliacao.py
      - name: Test without network or live Nyxal instance
        run: python3 -m unittest teste_falar_com_nyxal_autoavaliacao.py -v
