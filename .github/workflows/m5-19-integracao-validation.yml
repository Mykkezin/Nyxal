name: M5.19 Integração Residente da Atuação

on:
  push:
    branches:
      - feat/m5-19-integracao-residente-atuacao
  pull_request:
    branches:
      - main
      - feat/m5-19-integracao-residente-atuacao
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - "teste_m5_19_integracao_residente_atuacao.py"
      - ".github/workflows/m5-19-integracao-validation.yml"

jobs:
  validate-m5-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar M5.19
        run: python -m py_compile nixal_adaptador_sandbox_fisico.py nixal_auditoria_atuacao.py nixal_gateway_atuacao.py nixal_plano_central_controle.py nixal_ciclo_residente.py executar_nyxos_residente.py teste_m5_19_integracao_residente_atuacao.py
      - name: Executar teste M5.19
        run: python teste_m5_19_integracao_residente_atuacao.py
