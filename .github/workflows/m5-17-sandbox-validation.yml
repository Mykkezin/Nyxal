name: M5.17 Sandbox Físico Reversível

on:
  push:
    branches:
      - main
      - feat/m5-17-sandbox-fisico-reversivel
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "teste_m5_17_sandbox_fisico_reversivel.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"
      - ".github/workflows/m5-17-sandbox-validation.yml"
  pull_request:
    branches:
      - main
      - feat/m5-17-sandbox-fisico-reversivel
    paths:
      - "nixal_adaptador_sandbox_fisico.py"
      - "teste_m5_17_sandbox_fisico_reversivel.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_plano_central_controle.py"

permissions:
  contents: read

jobs:
  validate-m5-17:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.17
        run: python3 -m py_compile nixal_adaptador_sandbox_fisico.py teste_m5_17_sandbox_fisico_reversivel.py nixal_gateway_atuacao.py nixal_plano_central_controle.py
      - name: Executar teste M5.17
        run: python3 teste_m5_17_sandbox_fisico_reversivel.py
