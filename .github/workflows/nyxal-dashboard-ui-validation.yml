name: Nyxal Dashboard UI Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "interface/index.html"
      - "interface/js/nyxal-voice-console.js"
      - "interface/js/nyxal-api-client.js"
      - "teste_nyxos_voice_console.py"
      - "teste_voz_continua_56_5_6.py"
      - ".github/workflows/nyxal-dashboard-ui-validation.yml"
  push:
    branches: [main]
    paths:
      - "interface/index.html"
      - "interface/js/nyxal-voice-console.js"
      - "interface/js/nyxal-api-client.js"
      - "teste_nyxos_voice_console.py"
      - "teste_voz_continua_56_5_6.py"
      - ".github/workflows/nyxal-dashboard-ui-validation.yml"
  workflow_dispatch:

concurrency:
  group: nyxal-dashboard-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-dashboard-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile deterministic UI test harnesses
        run: python -m py_compile teste_nyxos_voice_console.py teste_voz_continua_56_5_6.py
      - name: Check external voice-console JavaScript syntax
        run: node --check interface/js/nyxal-voice-console.js
      - name: Check all inline JavaScript in main interface
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path("interface/index.html").read_text(encoding="utf-8")
          pattern = re.compile(r"<script\b([^>]*)>(.*?)</script\s*>", re.IGNORECASE | re.DOTALL)
          valid_types = {"", "text/javascript", "application/javascript", "module"}
          checked = 0
          with tempfile.TemporaryDirectory(prefix="nyxal-ui-js-") as temp:
              root = Path(temp)
              for index, match in enumerate(pattern.finditer(html), start=1):
                  attrs, body = match.group(1), match.group(2)
                  if re.search(r"\bsrc\s*=", attrs, re.IGNORECASE):
                      continue
                  type_match = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, re.IGNORECASE)
                  script_type = type_match.group(1).casefold() if type_match else ""
                  if script_type not in valid_types or not body.strip():
                      continue
                  script = root / f"inline-{index}.js"
                  script.write_text(body, encoding="utf-8")
                  subprocess.run(["node", "--check", str(script)], check=True)
                  checked += 1
          if not checked:
              raise SystemExit("Nenhum JavaScript inline foi validado.")
          print(f"JavaScript inline validado: {checked} scripts")
          PY
      - name: Run dashboard voice UI regressions
        run: python -m unittest -v teste_nyxos_voice_console
      - name: Run continuous voice integration regressions
        run: python teste_voz_continua_56_5_6.py
