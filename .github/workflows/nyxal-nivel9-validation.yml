concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nivel9:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar módulos
        id: compile_main
        run: |
          python3 -m py_compile             nixal_runtime.py             nixal_evolucao_controlada.py             nixal_laboratorio_remoto.py             nixal_evolucao_remota.py             nixal_solicitacao_evolucao.py             nixal_integracao_controlada.py             nixal_governanca_evolucao.py             nixal_observador_desenvolvimento.py             nixal_ciclo_local_nivel10.py             nixal_executor_ciclo_local_nivel10.py             nixal_nucleo_conversacional.py             nixal_memoria_conversacional.py             nixal_dialogo_qwen.py             nixal_processos_habitat.py             nixal_persistencia_operacional.py             nixal_delta.py             nixal_recursos_habitat.py             nixal_ciclo_residente.py             nixal_auto_experimento_ae2.py             nixal_auto_avaliacao_ae3.py             nixal_ciclo_evolucao_ae4.py             nixal_descoberta_continua_ae5.py             nixal_trilha_http.py teste_nixal_trilha_http.py teste_api_trilha_http_e2e.py nyxal_web_api.py nixal_decisao_autonoma_ci.py

      - name: Testes de autoreparo residente e integração
        run: |
          python3 -m py_compile nixal_autoreparo_residente.py nixal_ciclo_residente.py executar_nyxos_residente.py
          python3 -m unittest -v teste_nixal_autoreparo_residente.py
          python3 teste_m5_9_residencia_linux.py
          bash -n deploy/systemd/instalar_nyxos_servicos.sh deploy/systemd/diagnosticar_nyxos_local.sh

      - name: Testes HTTP de segurança da API
        id: api_http_security
        run: python3 -m unittest teste_api_security_auth.py -v

      - name: Testes privacy-first da trilha HTTP
        run: python3 -m unittest teste_nixal_trilha_http.py teste_api_trilha_http_e2e.py -v

      - name: Testes da política de segurança API
        id: api_policy
        run: python3 teste_seguranca_api.py

      - name: Decisão autônoma governada para bloqueios de CI
        id: decision_policy
        run: python3 teste_decisao_autonoma_ci.py

      - name: Suite Nível 9
        run: python3 teste_nivel_9_suite_final.py

      - name: Suite Nível 10
        run: python3 teste_nivel_10_suite_final.py

      - name: Suite Conversacional 56.5.5
        run: python3 teste_contexto_conversacional_56_5_5.py

      - name: Teste adaptador Qwen 56.5.5
        run: python3 teste_dialogo_qwen_56_5_5.py

      - name: Teste Núcleo Conversacional
        run: python3 teste_nucleo_conversacional.py

      - name: Smoke test API de chat sem voz
        id: chat_smoke
        run: python3 teste_api_chat_sem_voz.py

      - name: Teste Voz Contínua 56.5.6
        run: python3 teste_voz_continua_56_5_6.py

      - name: Teste Reflexão Diária 56.5.6
        run: python3 teste_reflexao_diaria_56_5_6.py

      - name: Teste Habitat NyxOS M5.1
        run: python3 teste_habitat_m5_1.py

      - name: Teste Processos do Habitat M5.2
        run: python3 teste_processos_habitat_m5_2.py

      - name: Teste Persistência Operacional M5.3
        run: python3 teste_persistencia_operacional_m5_3.py

      - name: Teste Delta M5.4
        run: python3 teste_delta_m5_4.py

      - name: Teste Interface M5.5
        run: python3 teste_interface_m5_5.py

      - name: Teste Recursos do Habitat M5.6
        run: python3 teste_recursos_habitat_m5_6.py

      - name: Teste Ciclo Residente M5.7
        run: python3 teste_ciclo_residente_m5_7.py

      - name: Teste controle de aprendizado residente
        run: python3 teste_controle_aprendizado_residente.py

      - name: Teste Série O9-O15 e handoff LLC
        run: python3 teste_serie_o9_o15_handoff_final.py

      - name: Sanidade de regras de segurança
        run: |
          python3 - <<'PY'
          from nixal_governanca_evolucao import GovernancaEvolucaoNixal
          from nixal_solicitacao_evolucao import SolicitacaoEvolucaoNixal

          assert GovernancaEvolucaoNixal.VERSAO == "9.5.0"
          assert SolicitacaoEvolucaoNixal.VERSAO == "9.4.0"
          assert "integrada" in GovernancaEvolucaoNixal.ESTADOS
          assert "rollback_registrado" in GovernancaEvolucaoNixal.ESTADOS
          assert "experimento_falhou" in SolicitacaoEvolucaoNixal.ESTADOS
          print("REGRAS_NIVEL9_OK")
          PY
      - name: Empacotar projeto completo (somente publicação manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/nyxal-package
          git archive --format=zip --output="/tmp/nyxal-package/Nyxal-N10-${GITHUB_SHA}.zip" "${GITHUB_SHA}"

      - name: Publicar projeto completo (opcional)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nyxal-projeto-nivel10
          path: /tmp/nyxal-package/Nyxal-N10-*.zip
          if-no-files-found: error
          retention-days: 1
      - name: Teste Auto-Evolution AE1
        run: python3 teste_auto_evolucao_ae1.py

      - name: Teste Auto-Experimento AE2
        run: python3 teste_auto_experimento_ae2.py

      - name: Teste AE2 no Ciclo Residente
        run: python3 teste_ae2_ciclo_residente.py

      - name: Teste Auto-Avaliação AE3
        run: python3 teste_auto_avaliacao_ae3.py

      - name: Teste AE3 no Ciclo Residente
        run: python3 teste_ae3_ciclo_residente.py

      - name: Teste Ciclo de Evolução AE4
        run: python3 teste_ciclo_evolucao_ae4.py

      - name: Teste Descoberta Contínua AE5
        run: python3 teste_descoberta_continua_ae5.py

      - name: Teste integrado da ativação residente AE5
        run: python3 -m unittest -v teste_ativacao_ae5_residente.py

      - name: Avaliar evidências e escolher próximo passo governado
        if: always()
        env:
          HEAD_SHA: ${{ github.sha }}
          JOB_OUTCOME: ${{ job.status }}
          COMPILE_OUTCOME: ${{ steps.compile_main.outcome }}
          POLICY_OUTCOME: ${{ steps.api_policy.outcome }}
          HTTP_OUTCOME: ${{ steps.api_http_security.outcome }}
          DECISION_OUTCOME: ${{ steps.decision_policy.outcome }}
          CHAT_OUTCOME: ${{ steps.chat_smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = {
              "compilacao": os.getenv("COMPILE_OUTCOME", "unknown"),
              "politica_origem": os.getenv("POLICY_OUTCOME", "unknown"),
              "integracao_http": os.getenv("HTTP_OUTCOME", "unknown"),
              "decisor": os.getenv("DECISION_OUTCOME", "unknown"),
              "chat_smoke": os.getenv("CHAT_OUTCOME", "unknown"),
          }
          def estado(value):
              return {"success": "passed", "failure": "failed", "skipped": "not_run"}.get(value, "unknown")
          job_outcome = os.getenv("JOB_OUTCOME", "unknown")
          executed = any(v in {"success", "failure"} for v in raw.values())
          failed = job_outcome == "failure" or any(v == "failure" for v in raw.values())
          passed = job_outcome == "success" and all(v == "success" for v in raw.values())
          resultado = "failed" if failed and executed else "passed" if passed else "unknown"
          states = {key: estado(value) for key, value in raw.items()}
          evidence = {
              "head_sha": os.getenv("HEAD_SHA", ""),
              "ci": {
                  "jobs": [{
                      "conclusion": job_outcome,
                      "steps": [{"name": key, "outcome": value} for key, value in raw.items()],
                      "logs_available": True,
                  }],
                  "repeticoes_pre_runner": 0,
                  "testes_executados": executed,
                  "resultado_testes": resultado,
              },
              "validacao_local": {
                  "compilacao": states["compilacao"],
                  "politica_origem": states["politica_origem"],
                  "integracao_http": states["integracao_http"],
                  "regressoes": estado(job_outcome),
              },
          }
          Path("/tmp/nyxal-ci-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          python3 nixal_decisao_autonoma_ci.py /tmp/nyxal-ci-evidence.json
