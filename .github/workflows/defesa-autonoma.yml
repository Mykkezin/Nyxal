name: Nyxal Governed Autonomous Defense

on:
  push:
    branches:
      - main
    paths:
      - "nixal_defesa_autonoma.py"
      - "teste_defesa_autonoma.py"
      - "docs/DEFESA_AUTONOMA_GOVERNADA.md"
      - ".github/workflows/defesa-autonoma.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nixal_defesa_autonoma.py"
      - "teste_defesa_autonoma.py"
      - "docs/DEFESA_AUTONOMA_GOVERNADA.md"
      - ".github/workflows/defesa-autonoma.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile defense policy
        run: python -m py_compile nixal_defesa_autonoma.py teste_defesa_autonoma.py
      - name: Run defense policy tests
        run: python -m unittest teste_defesa_autonoma.py -v
