name: Nyxal Governed Autonomous Defense

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - "nyxal_web_api.py"
      - "teste_api_security_auth.py"
      - "nixal_executor_defesa_governada.py"
      - "teste_executor_defesa_governada.py"
      - "nixal_defesa_autonoma.py"
      - "teste_defesa_autonoma.py"
      - "docs/DEFESA_AUTONOMA_GOVERNADA.md"
      - ".github/workflows/defesa-autonoma.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-tests:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile defense policy and dry-run gate
        run: python3 -m py_compile nixal_defesa_autonoma.py teste_defesa_autonoma.py nixal_executor_defesa_governada.py teste_executor_defesa_governada.py
      - name: Run defense policy tests
        run: python3 -m unittest teste_defesa_autonoma.py -v
      - name: Run governed dry-run execution gate tests
        run: python3 -m unittest teste_executor_defesa_governada.py -v
      - name: Run HTTP authentication and governed defense integration tests
        run: python3 -m unittest teste_api_security_auth.py -v
