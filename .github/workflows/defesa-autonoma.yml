name: Nyxal Governed Autonomous Defense

on:
  push:
    branches:
      - main
    paths:
      - "nixal_defesa_autonoma.py"
      - "teste_defesa_autonoma.py"
      - "docs/DEFESA_AUTONOMA_GOVERNADA.md"
      - ".github/workflows/defesa-autonoma.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nixal_defesa_autonoma.py"
      - "teste_defesa_autonoma.py"
      - "docs/DEFESA_AUTONOMA_GOVERNADA.md"
      - ".github/workflows/defesa-autonoma.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile defense policy
        run: python3 -m py_compile nixal_defesa_autonoma.py teste_defesa_autonoma.py
      - name: Run defense policy tests
        run: python3 -m unittest teste_defesa_autonoma.py -v
