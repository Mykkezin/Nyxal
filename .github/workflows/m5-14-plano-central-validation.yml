name: NyxOS M5.14 — plano central de controle

on:
  push:
    branches:
      - main
      - feat/m5-14-plano-central-controle
    paths:
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - "teste_m5_14_plano_central_controle.py"
      - "teste_m5_14_integracao_residente.py"
      - ".github/workflows/m5-14-plano-central-validation.yml"
  pull_request:
    branches:
      - main
      - feat/m5-14-plano-central-controle
    paths:
      - "nixal_plano_central_controle.py"
      - "nixal_ciclo_residente.py"
      - "executar_nyxos_residente.py"
      - "teste_m5_14_plano_central_controle.py"
      - "teste_m5_14_integracao_residente.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar-m5-14:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.14
        run: python3 -m py_compile nixal_plano_central_controle.py nixal_ciclo_residente.py executar_nyxos_residente.py teste_m5_14_plano_central_controle.py teste_m5_14_integracao_residente.py
      - name: Executar teste M5.14
        run: python3 teste_m5_14_plano_central_controle.py
      - name: Executar integração residente M5.14
        run: python3 teste_m5_14_integracao_residente.py
