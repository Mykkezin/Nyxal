name: M5.18 Auditoria de Atuação

on:
  push:
    branches:
      - feat/m5-18-auditoria-atuacao
    paths:
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_adaptador_sandbox_fisico.py"
      - "teste_m5_18_auditoria_atuacao.py"
  pull_request:
    branches:
      - main
      - feat/m5-18-auditoria-atuacao
    paths:
      - "nixal_auditoria_atuacao.py"
      - "nixal_gateway_atuacao.py"
      - "nixal_adaptador_sandbox_fisico.py"
      - "teste_m5_18_auditoria_atuacao.py"

permissions:
  contents: read

jobs:
  validate-m5-18:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Mykkezin')
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify system Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compilar M5.18
        run: python -m py_compile nixal_auditoria_atuacao.py nixal_gateway_atuacao.py nixal_adaptador_sandbox_fisico.py teste_m5_18_auditoria_atuacao.py
      - name: Executar teste M5.18
        run: python teste_m5_18_auditoria_atuacao.py
